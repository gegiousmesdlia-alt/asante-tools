<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Training Tool — Asante & Grove</title>
<link rel="stylesheet" href="css/style.css">

<!-- PWA / Add to Home Screen -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14171C">
<link rel="icon" href="icons/training-192.png">
<link rel="apple-touch-icon" href="icons/training-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-screen" id="login-screen">
  <form class="login-card" id="login-form">
    <div class="admin-brand">Asante &amp; Grove<small>Training Tool</small></div>
    <div class="field" style="margin-top:20px;"><label for="a-email">Email</label><input id="a-email" type="email" required></div>
    <div class="field"><label for="a-pass">Password</label><input id="a-pass" type="password" required></div>
    <button class="btn" style="width:100%;" type="submit">Sign in</button>
    <p id="login-error" style="color:var(--rust); font-family:var(--font-mono); font-size:0.78rem; margin-top:12px; display:none;"></p>
  </form>
</div>

<!-- MAIN (hidden until authenticated + whitelisted as an admin) -->
<div id="dashboard" style="display:none;">
  <header class="admin-header">
    <div class="admin-brand">Asante &amp; Grove<small>Training Tool</small></div>
    <div style="display:flex; align-items:center; gap:16px;">
      <span id="signed-in-as" style="font-family:var(--font-mono); font-size:0.78rem; color:var(--muted);"></span>
      <button class="btn outline small" id="logout-btn">Sign out</button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar">
      <button class="tab-btn active" data-tab="inbox">Inbox<span class="tab-badge badge count" id="inbox-tab-badge" style="display:none;"></span></button>
      <button class="tab-btn" data-tab="seeding">Seeding</button>
    </nav>
    <main class="main" id="main" style="max-width:900px;">
      <!-- panels injected by tool.js -->
    </main>
  </div>
</div>

<script type="module" src="js/firebase-config.js"></script>
<script type="module" src="js/tool.js"></script>
<script>
  // Registers the shell-caching service worker (see sw.js) — this is what
  // makes Chrome/Android offer "Add to Home Screen" / "Install app".
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
</script>
</body>
</html>
